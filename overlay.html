<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alfred — Overlay</title>
    <script type="module" src="/src/overlay.ts" defer></script>
  </head>
  <body class="overlay">
    <div id="overlay-shell">
      <header class="overlay-chrome">
        <div class="overlay-drag">
          <strong>Alfred</strong>
          <span id="overlay-hint">Drag anywhere to move · resize from the edge</span>
        </div>
        <button id="overlay-close" type="button" aria-label="Hide overlay">×</button>
      </header>
      <div id="overlay-chains" class="overlay-cols"></div>
    </div>
  </body>
</html>
